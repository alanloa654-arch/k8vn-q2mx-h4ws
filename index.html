<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>私人頁面</title>
<style>
  :root { --bg:#0f111a; --card:#1a1d2e; --accent:#e63946; --text:#f1faee; --muted:#8d99ae; }
  * { box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft JhengHei",sans-serif; }
  body { background:var(--bg); color:var(--text); margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
  .card { background:var(--card); border-radius:16px; padding:28px 22px; width:100%; max-width:400px; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  h1 { margin:0 0 8px; font-size:1.25rem; }
  p { margin:0 0 18px; color:var(--muted); font-size:.95rem; line-height:1.5; }
  input { width:100%; background:#121420; color:var(--text); border:1px solid #3a3f5c; border-radius:8px; padding:14px 12px; font-size:1.05rem; letter-spacing:.04em; min-height:48px; }
  button { width:100%; margin-top:14px; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:14px; font-size:1.05rem; font-weight:700; min-height:48px; cursor:pointer; }
  button:disabled { opacity:.6; }
  .err { color:#ff8a8a; margin-top:12px; font-size:.9rem; min-height:1.2em; }
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="current-password">
    <h1>私人頁面</h1>
    <p>請輸入密碼，解鎖之後就可以用。</p>
    <input id="pw" type="password" inputmode="text" autocapitalize="off" autocomplete="current-password" placeholder="密碼" required>
    <button id="go" type="submit">解鎖</button>
    <div class="err" id="err"></div>
  </form>
<script>
const ITERS = 210000;
function b64ToBytes(s) {
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: ITERS, hash: "SHA-256" },
    material,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}
async function unlock(password) {
  const N = 7;
  const chunks = [];
  for (let i = 0; i < N; i++) {
    const res = await fetch("p/" + i + ".b64", { cache: "no-store" });
    if (!res.ok) throw new Error("載入失敗");
    chunks.push((await res.text()).trim());
  }
  const packed = b64ToBytes(chunks.join(""));
  if (packed.length < 29) throw new Error("檔案損壞");
  const salt = packed.slice(0, 16);
  const nonce = packed.slice(16, 28);
  const data = packed.slice(28);
  const key = await deriveKey(password, salt);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, key, data);
  const html = new TextDecoder().decode(plain);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  location.replace(URL.createObjectURL(blob));
}
const f = document.getElementById("f");
const err = document.getElementById("err");
const go = document.getElementById("go");
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = "";
  const password = document.getElementById("pw").value;
  go.disabled = true;
  go.textContent = "解鎖緊…";
  try {
    await unlock(password);
  } catch (x) {
    err.textContent = "密碼不正確，或者載入失敗，請再試一次。";
    go.disabled = false;
    go.textContent = "解鎖";
  }
});
</script>
</body>
</html>
